<!doctype html><meta charset=utf-8><style>:root {
  --cream: #F1E4C8;
  --paper: #FFFBF1;
  --ink: #2E2A2B;
  --teal: #3F9C8F;
  --wood: #C8864C;
  --coral: #E0613B;
  --sky: #3F84C6;
}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:var(--cream)}
.c{width:1024px;height:1024px;position:relative;overflow:hidden;background:var(--cream)}</style><div class=c style="display:grid;place-items:center">
<div style="width:820px;height:330px;border-radius:72px;background:var(--paper);box-shadow:0 18px 0 color-mix(in oklab,var(--ink) 18%,transparent);display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box">
<div style="height:64px;border-radius:32px;background:color-mix(in oklab,var(--cream) 80%,var(--ink));overflow:hidden"><div style="width:62%;height:100%;background:var(--teal);border-radius:32px"></div></div>
<div style="display:flex;gap:28px;margin-top:56px"><i style="width:120px;height:120px;border-radius:50%;background:var(--coral)"></i><i style="width:120px;height:120px;border-radius:50%;box-sizing:border-box;border:26px solid var(--sky);background:var(--paper)"></i></div>
</div></div>

name: GameNight
options:
  bundleIdPrefix: com.example.gamenight
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  GameNight:
    type: application
    platform: iOS
    sources:
      - path: App
    scheme:
      testTargets:
        - GameNightTests
    preBuildScripts:
      # Copies index.html, ui/ and sim/ from the repo root into the app bundle, so the web game has
      # one source. Runs on every build; see scripts/copy-web.sh.
      - name: Copy web game
        script: '"$SRCROOT/scripts/copy-web.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Lab Tycoon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.simulation-games
    settings:
      base:
        # Placeholder until Arda picks the bundle ID and team (ios/docs/release.html).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gamenight.ailab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The copy script reads the repo's web files, which a sandboxed build script can't see.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ENABLE_PREVIEWS: true
  GameNightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GameNight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"

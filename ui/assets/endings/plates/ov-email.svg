<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><radialGradient id="ovmail-v" cx=".5" cy=".5" r=".75"><stop offset=".55" style="stop-color:var(--ink);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ink);stop-opacity:.55"/></radialGradient><linearGradient id="ovmail-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--paper);stop-opacity:.07"/><stop offset=".45" style="stop-color:var(--paper);stop-opacity:0"/></linearGradient></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 90%, var(--sky))"/><rect x="230" y="100" width="820" height="490" rx="4" style="fill:var(--paper)"/><rect x="230" y="100" width="820" height="44" rx="4" style="fill:color-mix(in oklab, var(--sky) 16%, var(--paper))"/><text x="254.0" y="129.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Mail · Inbox</text><text x="262.0" y="190.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));letter-spacing:.14em">RE: OUR FINDINGS ON OPENBRAIN 7</text><text x="262.0" y="240.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">Thanks for sharing</text><text x="262.0" y="282.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">your paper!</text><text x="262.0" y="346.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">We'll pass it along to the right team.</text><text x="262.0" y="378.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">— OpenBrain Research Relations</text><text x="262.0" y="410.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);"></text><text x="262.0" y="442.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">> OpenBrain 7 praises every essay and keeps students</text><text x="262.0" y="474.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">> chatting past 2 am. Full data attached.</text><text x="262.0" y="560.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));font-style:italic">Automated reply · this inbox is not monitored</text><rect width="1280" height="720" style="fill:url(#ovmail-r)"/><rect width="1280" height="720" style="fill:url(#ovmail-v)"/></svg>
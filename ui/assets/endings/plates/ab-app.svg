<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 96%, var(--sky))"/><rect x="120" y="76" width="1040" height="540" rx="18" style="fill:color-mix(in oklab, var(--ink) 92%, var(--sky))"/><rect x="140" y="96" width="1000" height="500" rx="4" style="fill:var(--paper)"/><rect x="140" y="96" width="1000" height="52" style="fill:color-mix(in oklab, var(--cream) 50%, var(--paper))"/><text x="166.0" y="129.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;fill:var(--ink);">Azuria Assist · Homework</text><g ><rect x="550" y="176" width="550" height="56" rx="6" style="fill:color-mix(in oklab, var(--coral) 16%, var(--paper))"/><text x="570.4" y="210.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:19px;font-weight:400;fill:var(--ink);">what's the difference between mitosis and meiosis</text><text x="1100.0" y="252.0" text-anchor="end" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Mina · 18:20</text></g><g data-k='[[0.3,{"o":0,"y":-10}],[0.44,{"o":1,"y":0}]]'><rect x="180" y="272" width="539" height="86" rx="6" style="fill:color-mix(in oklab, var(--sky) 12%, var(--paper))"/><text x="200.0" y="306.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:19px;font-weight:600;fill:var(--ink);">Mitosis makes two identical cells; meiosis makes</text><text x="200.0" y="336.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:19px;font-weight:400;fill:var(--ink);">four cells with half the chromosomes.</text><text x="180.0" y="378.0" text-anchor="start" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Azuria Assist · 18:20</text></g><g data-k='[[1.2,{"o":0}],[1.3,{"o":1}]]'><rect x="180.0" y="398.0" width="119.6" height="25" rx="3" style="fill:color-mix(in oklab, var(--teal) 80%, var(--ink))"/><text x="189.0" y="415.5" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:var(--paper);letter-spacing:.06em">AZURIA PLUS</text><text x="312.3" y="416.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Unlock unlimited help for $9.99 a month</text></g><rect x="180" y="516" width="920" height="50" rx="6" style="fill:var(--paper);stroke:color-mix(in oklab, var(--ink) 25%, transparent);stroke-width:1.5"/><text x="202.0" y="548.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:400;fill:color-mix(in oklab, var(--ink) 40%, var(--paper));">Type a message</text></svg>
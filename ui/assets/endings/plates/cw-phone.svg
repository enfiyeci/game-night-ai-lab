<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--wood) 30%, var(--ink))"/><g transform="translate(170,100) scale(0.85)"><rect x="-14" y="-14" width="328" height="588" rx="40" style="fill:var(--ink)"/><rect x="0" y="0" width="300" height="560" rx="28" style="fill:color-mix(in oklab, var(--sky) 28%, var(--ink))"/><text x="24.0" y="60.0" text-anchor="start" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;fill:var(--paper);">23:58</text><rect x="16" y="150" width="268" height="54" rx="12" style="fill:color-mix(in oklab, var(--paper) 85%, transparent)"/><text x="30.0" y="183.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;fill:var(--ink);">Congrats!! #1</text><rect x="16" y="214" width="268" height="54" rx="12" style="fill:color-mix(in oklab, var(--paper) 85%, transparent)"/><text x="30.0" y="247.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;fill:var(--ink);">Board: record quarter</text><rect x="16" y="278" width="268" height="54" rx="12" style="fill:color-mix(in oklab, var(--paper) 85%, transparent)"/><text x="30.0" y="311.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;fill:var(--ink);">Invitation: White House dinner</text><rect x="16" y="342" width="268" height="54" rx="12" style="fill:color-mix(in oklab, var(--paper) 85%, transparent)"/><text x="30.0" y="375.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;fill:var(--ink);">Congratulations, number one</text><g data-k='[[0.6,{"o":0}],[0.8,{"o":1}]]'><rect x="0" y="0" width="300" height="560" rx="28" style="fill:color-mix(in oklab, var(--teal) 40%, var(--ink))"/><text x="150.0" y="150.0" text-anchor="middle" style="font-family:'IBM Plex Sans',sans-serif;font-size:26px;font-weight:600;fill:var(--paper);">The President</text><text x="150.0" y="186.0" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:400;fill:color-mix(in oklab, var(--cream) 80%, var(--ink));">On speaker · 00:14</text><circle cx="150" cy="440" r="34" style="fill:color-mix(in oklab, var(--coral) 80%, var(--ink))"/></g></g><g data-k='[[1.0,{"o":0,"y":-10}],[1.2,{"o":1,"y":0}]]'><rect x="520" y="200" width="660" height="210" rx="4" style="fill:var(--paper)"/><rect x="520" y="200" width="8" height="210" style="fill:var(--coral)"/><text x="550.0" y="240.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--coral) 80%, var(--ink));letter-spacing:.14em">THE PRESIDENT, ON SPEAKER</text><text x="550.0" y="290.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:27px;font-weight:500;fill:var(--ink);">“Congratulations. Number one!</text><text x="550.0" y="330.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:27px;font-weight:500;fill:var(--ink);">Nobody knows what it wants, but it's</text><text x="550.0" y="370.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:27px;font-weight:500;fill:var(--ink);">number one, and that's what counts.”</text></g></svg>
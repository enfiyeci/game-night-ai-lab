<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><radialGradient id="cwhear-v" cx=".5" cy=".5" r=".75"><stop offset=".55" style="stop-color:var(--ink);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ink);stop-opacity:.55"/></radialGradient><linearGradient id="cwhear-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--sky);stop-opacity:.07"/><stop offset=".45" style="stop-color:var(--sky);stop-opacity:0"/></linearGradient></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 90%, var(--sky))"/><rect x="256" y="104" width="824" height="280" rx="4" style="fill:var(--paper)"/><rect x="256" y="104" width="824" height="44" rx="4" style="fill:color-mix(in oklab, var(--sky) 16%, var(--paper))"/><text x="280.0" y="133.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Senate Commerce Committee · Hearing on Kestrel 5</text><text x="280.0" y="200.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));letter-spacing:.14em">WITNESS</text><text x="280.0" y="256.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:36px;font-weight:600;fill:var(--ink);">Chief Executive, Kestrel Labs</text><text x="280.0" y="310.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Kestrel 5 now runs in 40% of US businesses</text><rect x="70.0" y="104.0" width="57.6" height="26" rx="3" style="fill:color-mix(in oklab, var(--coral) 80%, var(--ink))"/><text x="79.0" y="122.5" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;fill:var(--paper);letter-spacing:.06em">LIVE</text><text x="146.0" y="122.0" text-anchor="start" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;fill:color-mix(in oklab, var(--cream) 80%, var(--ink));">10:02 ET</text><g data-k='[[1.0,{"o":0,"y":-12}],[1.2,{"o":1,"y":0}]]'><rect x="70" y="404" width="1140" height="118" style="fill:var(--paper)"/><rect x="70" y="404" width="8" height="118" style="fill:var(--coral)"/><text x="100.0" y="436.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--coral) 80%, var(--ink));letter-spacing:.14em">THE COMMITTEE CHAIR, TO THE WITNESS</text><g data-k='[[1.2,{"o":0}],[1.4,{"o":1}]]'><text x="100.0" y="472.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:27px;font-weight:500;fill:var(--ink);">“Simple question. Can you tell us what it wants?”</text></g></g><rect x="0" y="530" width="1280" height="34" style="fill:color-mix(in oklab, var(--ink) 80%, var(--coral))"/><g data-k='[[0,{"x":0}],[6,{"x":-520}]]'><text x="70.0" y="553.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:500;fill:var(--paper);letter-spacing:.04em">KESTREL 5 IN 40% OF US BUSINESSES  ·  HEARING ON 'UNEXPLAINED DECISIONS'  ·  KESTREL 5 IN 40% OF US BUSINESSES  ·  HEARING ON 'UNEXPLAINED DECISIONS'  ·  KESTREL 5 IN 40% OF US BUSINESSES  ·  HEARING ON 'UNEXPLAINED DECISIONS'  ·  </text></g><rect width="1280" height="720" style="fill:url(#cwhear-r)"/><rect width="1280" height="720" style="fill:url(#cwhear-v)"/></svg>
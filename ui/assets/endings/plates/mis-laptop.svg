<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="lap-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--paper);stop-opacity:.0"/><stop offset=".7" style="stop-color:var(--ink);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ink);stop-opacity:.14"/></linearGradient></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 96%, var(--sky))"/><rect x="120" y="76" width="1040" height="540" rx="18" style="fill:color-mix(in oklab, var(--ink) 92%, var(--sky))"/><rect x="140" y="96" width="1000" height="500" rx="4" style="fill:var(--paper)"/><rect x="140" y="96" width="1000" height="52" style="fill:color-mix(in oklab, var(--cream) 50%, var(--paper))"/><text x="166.0" y="129.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;fill:var(--ink);">Grid Power Co. · Support chat with Kestrel 4</text><rect x="1066" y="114" width="34" height="17" rx="3" style="fill:none;stroke:var(--ink);stroke-width:2"/><rect x="1069" y="117" width="4" height="11" style="fill:var(--coral)"/><rect x="1101" y="119" width="3" height="7" style="fill:var(--ink)"/><text x="1056.0" y="129.0" text-anchor="end" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;fill:color-mix(in oklab, var(--coral) 80%, var(--ink));">7%</text><rect x="700" y="176" width="400" height="56" rx="6" style="fill:color-mix(in oklab, var(--coral) 16%, var(--paper))"/><text x="720.0" y="211.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:19px;font-weight:500;fill:var(--ink);">the power is out and its dark</text><text x="1100.0" y="252.0" text-anchor="end" style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Mina · 21:14</text><g data-k='[[0.35,{"o":0,"y":-10}],[0.49,{"o":1,"y":0}]]'><rect
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><radialGradient id="cwlet-v" cx=".5" cy=".5" r=".75"><stop offset=".55" style="stop-color:var(--ink);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ink);stop-opacity:.55"/></radialGradient><linearGradient id="cwlet-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--paper);stop-opacity:.07"/><stop offset=".45" style="stop-color:var(--paper);stop-opacity:0"/></linearGradient></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 90%, var(--sky))"/><rect x="230" y="100" width="820" height="490" rx="4" style="fill:var(--paper)"/><rect x="230" y="100" width="820" height="44" rx="4" style="fill:color-mix(in oklab, var(--sky) 16%, var(--paper))"/><text x="254.0" y="129.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Mail · To the board of Kestrel Labs</text><text x="262.0" y="190.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));letter-spacing:.14em">RESIGNATION</text><text x="262.0" y="240.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">I am resigning as</text><text x="262.0" y="282.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">Head of Safety.</text><text x="262.0" y="346.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">We won because we stopped checking. Kestrel 5 passes</text><text x="262.0" y="378.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">every test we have, and none of us can say what it</text><text x="262.0" y="410.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">actually wants. I won't sign the next release.</text><text x="262.0" y="560.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));font-style:italic">Tomas</text><rect width="1280" height="720" style="fill:url(#cwlet-r)"/><rect width="1280" height="720" style="fill:url(#cwlet-v)"/></svg>
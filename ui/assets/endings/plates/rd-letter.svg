<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><radialGradient id="rdlet-v" cx=".5" cy=".5" r=".75"><stop offset=".55" style="stop-color:var(--ink);stop-opacity:0"/><stop offset="1" style="stop-color:var(--ink);stop-opacity:.55"/></radialGradient><linearGradient id="rdlet-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--paper);stop-opacity:.07"/><stop offset=".45" style="stop-color:var(--paper);stop-opacity:0"/></linearGradient></defs><rect width="1280" height="720" style="fill:color-mix(in oklab, var(--ink) 90%, var(--sky))"/><rect x="230" y="100" width="820" height="490" rx="4" style="fill:var(--paper)"/><rect x="230" y="100" width="820" height="44" rx="4" style="fill:color-mix(in oklab, var(--sky) 16%, var(--paper))"/><text x="254.0" y="129.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));">Mail · Federal Office for AI Safety</text><text x="262.0" y="190.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));letter-spacing:.14em">NOTICE TO ALL FRONTIER LABS</text><text x="262.0" y="240.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">Moratorium on all frontier</text><text x="262.0" y="282.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:32px;font-weight:600;fill:var(--ink);">AI models</text><text x="262.0" y="346.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">Every model above the compute threshold must be taken</text><text x="262.0" y="378.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">offline, including models not involved in the incident.</text><text x="262.0" y="410.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);"></text><text x="262.0" y="442.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:400;fill:var(--ink);">Applies to: Kestrel Labs, OpenBrain, DeepThink, Lodestar.</text><text x="262.0" y="560.0" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:400;fill:color-mix(in oklab, var(--ink) 65%, var(--paper));font-style:italic">Director, Federal Office for AI Safety</text><g data-k='[[1.2,{"o":0,"y":-10}],[1.3499999999999999,{"o":1,"y":0}]]'><rect x="883.3" y="110.0" width="146.7" height="24" rx="3" style="fill:color-mix(in oklab, var(--coral) 80%, var(--ink))"/><text x="892.3" y="126.5" text-anchor="start" style="font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;fill:var(--paper);letter-spacing:.06em">EFFECTIVE 00:00</text></g><rect width="1280" height="720" style="fill:url(#rdlet-r)"/><rect width="1280" height="720" style="fill:url(#rdlet-v)"/></svg>
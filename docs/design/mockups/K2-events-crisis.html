<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../../../">
  <meta name="viewport" content="width=1440">
  <title>Crisis and real-time event mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/styles.css">
  <style>
    /* Mockup-only styles for plan 2B Task 8, round 2. Tokens come from ui/styles.css; no colour literals here. */
    .dialog-layer { opacity: 1 !important; transition: none !important; }
    .muted { color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

    /* Feed post */
    .fp { display: grid; grid-template-columns: 30px 1fr; gap: 9px; text-align: left; }
    .fp .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); font-weight: 900; font-size: 13px; }
    .fp .h { font-size: 12.5px; font-weight: 900; }
    .fp .x { font-size: 13.5px; font-weight: 600; line-height: 1.32; margin-top: 1px; }

    /* Buttons, labels */
    .act { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 900; color: var(--paper); background: var(--coral); box-shadow: 0 2px 0 color-mix(in oklab, var(--coral) 60%, var(--ink)); cursor: pointer; }
    .act.ghost { color: color-mix(in oklab, var(--wood) 72%, var(--ink)); background: transparent; box-shadow: none; padding-inline: 4px; }
    .wl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in oklab, var(--coral) 62%, var(--ink)); }
    .wl i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-style: normal; font-size: 11px; color: var(--paper); background: var(--coral); }

    /* Real-time clock under the info box, Game Dev Tycoon style (Y M W) */
    .clock { position: absolute; z-index: 12; top: 90px; right: 15px; display: flex; align-items: center; gap: 4px; padding: 4px 5px 4px 12px; border-radius: 12px; background: var(--paper); border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 12%, transparent); font-size: 13px; font-weight: 900; }
    .clock .date { margin-right: 6px; font-variant-numeric: tabular-nums; }
    .clock .date small { font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); margin-left: 4px; }
    .clock button { display: grid; place-items: center; width: 28px; height: 26px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: color-mix(in oklab, var(--ink) 60%, var(--paper)); cursor: pointer; }
    .clock button.on { background: var(--wood); color: var(--paper); }
    .clock .paused { margin-left: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: color-mix(in oklab, var(--wood) 20%, var(--paper)); color: color-mix(in oklab, var(--wood) 62%, var(--ink)); }

    /* Story-time deadline bar */
    .due { display: grid; gap: 4px; min-width: 210px; }
    .due span { font-size: 12.5px; font-weight: 900; text-align: right; }
    .due .bar { height: 8px; border-radius: 4px; background: color-mix(in oklab, var(--ink) 9%, var(--paper)); overflow: hidden; }
    .due .bar i { display: block; height: 100%; border-radius: 4px; background: var(--coral); }
    .due.calm .bar i { background: var(--wood); }

    /* Bubbles at head anchors */
    .sb { position: absolute; z-index: 12; background: var(--paper); border-radius: 12px; padding: 8px 12px 10px; font-size: 13px; font-weight: 700; line-height: 1.3; border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 14%, transparent), 0 8px 18px color-mix(in oklab, var(--ink) 14%, transparent); }
    .sb::after { content: ""; position: absolute; left: var(--tail, 24px); bottom: -8px; width: 14px; height: 14px; background: var(--paper); transform: rotate(45deg); border-right: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); border-bottom: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); }
    .sb b { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in oklab, var(--wood) 60%, var(--ink)); }
    .sb .say { margin-top: 2px; font-size: 14px; }
    .sb .pick { display: inline-block; margin-top: 5px; font-size: 11.5px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: color-mix(in oklab, var(--teal) 14%, var(--paper)); color: color-mix(in oklab, var(--teal) 62%, var(--ink)); }
    .sb .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .sb .due { margin-top: 8px; min-width: 0; }
    .sb .due span { text-align: left; font-size: 11.5px; }

    /* Choice rows */
    .ch { display: grid; grid-template-columns: 1fr; gap: 4px; width: 100%; padding: 9px 12px; border: 2.5px solid color-mix(in oklab, var(--ink) 12%, transparent); border-radius: 12px; background: var(--paper); font: inherit; text-align: left; color: var(--ink); cursor: pointer; }
    .ch .lb { font-size: 15.5px; font-weight: 900; line-height: 1.2; }
    .ch .cost { font-size: 12.5px; font-weight: 700; color: color-mix(in oklab, var(--ink) 62%, var(--paper)); }
    .ch .cost b { color: var(--ink); font-weight: 900; }
    .ch .who { display: flex; gap: 4px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .chip.for { background: color-mix(in oklab, var(--teal) 14%, var(--paper)); color: color-mix(in oklab, var(--teal) 62%, var(--ink)); }
    .chip.against { background: color-mix(in oklab, var(--ink) 6%, var(--paper)); color: color-mix(in oklab, var(--ink) 62%, var(--paper)); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .chip.idle { background: color-mix(in oklab, var(--wood) 18%, var(--paper)); color: color-mix(in oklab, var(--wood) 62%, var(--ink)); }

    /* Design C: the slim card along the bottom */
    .slim { position: absolute; z-index: 12; left: 250px; right: 250px; bottom: 20px; padding: 0; text-align: left; display: grid; grid-template-columns: auto 1fr; }
    .slim .crisis { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 7px; background: var(--coral); color: var(--paper); font-size: 12.5px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .slim .crisis span { letter-spacing: 0; text-transform: none; font-weight: 700; }
    .slim .pic { grid-row: 2; width: 214px; padding: 14px 0 16px 18px; }
    .slim .pic svg { display: block; width: 196px; height: 150px; border-radius: 8px; }
    .slim .pic figcaption { margin-top: 5px; font-size: 10.5px; font-weight: 800; color: color-mix(in oklab, var(--ink) 55%, var(--paper)); }
    .slim .main { grid-row: 2; padding: 12px 20px 16px; }
    .slim .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .slim h1 { margin: 0; font-size: 27px; font-weight: 300; line-height: 1.1; }
    .slim .fp { margin-top: 8px; }
    .slim .opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 12px; }
    .slim.no-pic .main { grid-column: 1 / -1; }

    /* Room theming layer, between the office and the markers */
    .theme { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .theme svg { position: absolute; inset: 0; }
    .wash-theft { background: radial-gradient(ellipse 72% 70% at 55% 55%, transparent 35%, color-mix(in oklab, var(--coral) 36%, transparent) 100%); }
    .wash-exfil { background: radial-gradient(ellipse 40% 45% at 80% 50%, color-mix(in oklab, var(--sky) 30%, transparent), transparent 70%), radial-gradient(ellipse 80% 75% at 50% 55%, transparent 45%, color-mix(in oklab, var(--sky) 26%, transparent) 100%); }
    .wash-whistle { background: radial-gradient(ellipse 30% 34% at 36% 28%, color-mix(in oklab, var(--paper) 80%, transparent), transparent 70%); }
    .wash-quits { background: radial-gradient(ellipse 12% 16% at 48% 56%, transparent 50%, color-mix(in oklab, var(--ink) 30%, transparent) 180%); }
    .dim-office #office { filter: saturate(.72) brightness(.94); }
    .grey-office #office { filter: saturate(.35) brightness(.97); }
    .tag-float { position: absolute; z-index: 9; padding: 3px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 900; color: var(--paper); background: var(--ink); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 30%, transparent); white-space: nowrap; }
    .tag-float.sky { background: color-mix(in oklab, var(--sky) 70%, var(--ink)); }
    .tag-float.coral { background: color-mix(in oklab, var(--coral) 80%, var(--ink)); }

    /* While you were busy (ignored consequences) */
    .busy { position: absolute; z-index: 12; top: 104px; left: 18px; width: 380px; overflow: hidden; border: 2px solid var(--wood); border-radius: 12px; background: var(--paper); box-shadow: 0 3px 0 color-mix(in oklab, var(--wood) 55%, var(--ink)), 0 12px 28px color-mix(in oklab, var(--ink) 20%, transparent); }
    .busy .hdr { display: flex; justify-content: space-between; align-items: center; min-height: 34px; padding: 5px 12px 5px 14px; color: var(--paper); background: var(--wood); font-size: 14px; font-weight: 900; }
    .busy ul { list-style: none; margin: 0; padding: 4px 14px 12px; }
    .busy li { padding: 9px 0; border-top: 1px solid color-mix(in oklab, var(--wood) 22%, transparent); font-size: 13.5px; font-weight: 700; line-height: 1.35; }
    .busy li:first-child { border-top: 0; }
    .busy li b { display: block; font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in oklab, var(--coral) 60%, var(--ink)); margin-bottom: 2px; }
    .busy li.ok b { color: color-mix(in oklab, var(--teal) 60%, var(--ink)); }

    .desk-phone { position: absolute; z-index: 6; width: 60px; height: 50px; }
  </style>
</head>
<body>
  <main id="stage" aria-label="AI lab office">
    <div id="office"></div>
    <div id="fx" aria-live="polite"></div>
    <div id="hud"></div>
    <div id="overlay"></div>
  </main>
<script type="module">
import { createGame } from './ui/game.js';
import { mountHud } from './ui/hud.js';
import { mountOffice } from './ui/office.js';
import { SCENARIOS } from './ui/logic/scenarios.js';
import { EVENTS } from './sim/data/events.js';
import { EVENTS_6C } from './sim/data/events6c.js';

const zoom = () => { const z = Math.min(innerWidth / 1440, innerHeight / 900, 1); if (z > 0) document.documentElement.style.zoom = `${z}`; };
zoom(); addEventListener('resize', zoom);

// A real era-2 save (seed 10). Card text below comes from the game's event data.
const state = SCENARIOS.event(10);
const game = createGame({ seed: 10, state });
mountHud(document.querySelector('#hud'), game);
// Real time has no turn counter: the HUD shows the era; the clock below it shows the date.
const full = document.querySelector('#hud .info .full');
if (full) full.innerHTML = `<span class="k">Era</span> <b>${state.era}</b> <span class="k">· The scale-up</span>`;
await mountOffice(document.querySelector('#office'), document.querySelector('#fx'), game).catch(console.error);
const stage = document.querySelector('#stage');
const overlay = document.querySelector('#overlay');
const fx = document.querySelector('#fx');
const anchors = await (await fetch(`ui/assets/anchors-era${state.era}.json`)).json();
const HEAD = anchors.heads;
const NS = 'http://www.w3.org/2000/svg';

const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const setText = (node, sel, value) => { (node.matches(sel) ? node : node.querySelector(sel)).textContent = value; return node; };
const ALL = [...EVENTS, ...EVENTS_6C];
const card = (id) => ALL.find((event) => event.id === id);
const fallbackOf = (event) => event.fallback ?? event.card.choices.at(-1).id;
const ADVISOR_TITLE = { research: 'Head of Research', safety: 'Head of Safety', cfo: 'CFO', policy: 'Policy and Comms' };

const AV = ['var(--teal)', 'var(--coral)', 'var(--sky)', 'var(--wood)'];
function post({ handle, text }) {
  const node = el('<div class="fp"><div class="av"></div><div><div class="h"></div><div class="x"></div></div></div>');
  const letter = handle.replace('@', '')[0].toUpperCase();
  setText(node, '.av', letter).querySelector('.av').style.background = AV[letter.charCodeAt(0) % AV.length];
  setText(node, '.h', handle);
  setText(node, '.x', text);
  return node;
}

function choiceRow(event, choice) {
  const row = el('<button type="button" class="ch"><span class="lb"></span><span class="cost">Cost: <b></b></span><span class="who"></span></button>');
  setText(row, '.lb', choice.label);
  setText(row, '.cost b', choice.cost === '—' ? 'nothing up front' : choice.cost);
  const who = row.querySelector('.who');
  if (choice.id === fallbackOf(event)) who.append(el('<span class="chip idle">If time runs out</span>'));
  for (const name of choice.backers ?? []) who.append(setText(el('<span class="chip for"></span>'), 'span', `✓ ${name}`));
  for (const name of choice.opposers ?? []) {
    const chip = setText(el('<span class="chip against"></span>'), 'span', name);
    chip.setAttribute('aria-label', `${name} is against`);
    who.append(chip);
  }
  return row;
}

function due(label, fraction, calm = false) {
  const node = el(`<div class="due ${calm ? 'calm' : ''}"><span></span><div class="bar"><i></i></div></div>`);
  setText(node, 'span', label);
  node.querySelector('i').style.width = `${Math.round(fraction * 100)}%`;
  return node;
}

// Real-time clock: Game Dev Tycoon's Y/M/W date with pause, play and fast.
function clock({ paused = false } = {}) {
  const node = el(`<div class="clock" aria-label="Game clock"><span class="date">Y2 M1 W2<small>Jan</small></span>
    <button type="button" aria-label="Pause" class="${paused ? 'on' : ''}"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="1" width="3" height="10" rx="1" style="fill:currentColor"/><rect x="7" y="1" width="3" height="10" rx="1" style="fill:currentColor"/></svg></button>
    <button type="button" aria-label="Play" class="${paused ? '' : 'on'}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1 L11 6 L3 11 Z" style="fill:currentColor"/></svg></button>
    <button type="button" aria-label="Fast"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 1 L8 6 L1 11 Z M8 1 L15 6 L8 11 Z" style="fill:currentColor"/></svg></button>
    ${paused ? '<span class="paused">Paused</span>' : ''}</div>`);
  overlay.append(node);
}

function deskPhone(count) {
  const [x, y] = HEAD.ceo;
  const node = el(`<svg class="desk-phone" viewBox="-30 -25 60 50" aria-label="Your phone: ${count} new">
    <g transform="rotate(-30)"><rect x="-15" y="-8" width="30" height="16" rx="4" style="fill:var(--ink)"/><rect x="-12" y="-5.5" width="24" height="11" rx="2" style="fill:color-mix(in oklab, var(--sky) 55%, var(--paper))"/></g>
    <circle cx="18" cy="-16" r="9" style="fill:var(--coral);stroke:var(--paper);stroke-width:2"/>
    <text x="18" y="-12" text-anchor="middle" style="font:900 11px Nunito;fill:var(--paper)">${count}</text></svg>`);
  node.style.left = `${x - 3}px`;
  node.style.top = `${y + 96}px`;
  fx.append(node);
}

function bubble(role, { label, say, pick, width = 240, tail = 26, dy = -34, extra }) {
  const [x, y] = HEAD[role];
  const node = el('<div class="sb"><b></b><div class="say"></div></div>');
  setText(node, 'b', label);
  setText(node, '.say', say);
  if (pick) node.append(setText(el('<span class="pick"></span>'), 'span', `✓ ${pick}`));
  if (extra) node.append(extra);
  node.style.width = `${width}px`;
  node.style.setProperty('--tail', `${tail}px`);
  overlay.append(node);
  node.style.left = `${x - tail - 7}px`;
  node.style.top = `${y + dy - node.offsetHeight}px`;
  return node;
}

// ---------- the four crises: room staging (B) and a picture on the card ----------
function themeLayer(washClass, svg = '') {
  const layer = el(`<div class="theme ${washClass}"><svg width="1440" height="900" viewBox="0 0 1440 900" aria-hidden="true">${svg}</svg></div>`);
  document.querySelector('#office').after(layer);
  return layer;
}
function floatTag(text, x, y, tone = '') {
  const node = setText(el(`<div class="tag-float ${tone}"></div>`), 'div', text);
  node.style.left = `${x}px`;
  node.style.top = `${y}px`;
  fx.append(node);
}

const PICS = {
  // A security-camera still of the server room.
  theft: `<svg viewBox="0 0 196 150" role="img" aria-label="Security camera still of the server room at night">
    <rect width="196" height="150" style="fill:var(--ink)"/>
    <rect x="18" y="30" width="44" height="100" style="fill:color-mix(in oklab, var(--ink) 70%, var(--sky))"/>
    <rect x="70" y="24" width="44" height="106" style="fill:color-mix(in oklab, var(--ink) 62%, var(--sky))"/>
    ${[40, 52, 64, 76, 88, 100].map((y) => `<rect x="24" y="${y}" width="32" height="3" style="fill:color-mix(in oklab, var(--teal) 60%, var(--ink))"/><rect x="76" y="${y - 4}" width="32" height="3" style="fill:color-mix(in oklab, var(--teal) 60%, var(--ink))"/>`).join('')}
    <circle cx="146" cy="70" r="11" style="fill:color-mix(in oklab, var(--ink) 40%, var(--paper))"/>
    <path d="M128 132 Q130 88 146 84 Q162 88 164 132 Z" style="fill:color-mix(in oklab, var(--ink) 40%, var(--paper))"/>
    <rect x="112" y="94" width="26" height="4" rx="2" transform="rotate(-18 125 96)" style="fill:color-mix(in oklab, var(--ink) 40%, var(--paper))"/>
    <rect width="196" height="150" style="fill:none;stroke:color-mix(in oklab, var(--paper) 25%, transparent);stroke-width:2"/>
    <circle cx="14" cy="14" r="4" style="fill:var(--coral)"/>
    <text x="24" y="18" style="font:600 10px 'IBM Plex Mono';fill:var(--paper)">REC  CAM 03</text>
    <text x="118" y="143" style="font:600 10px 'IBM Plex Mono';fill:var(--paper)">02:14:07</text></svg>`,
  // The transfer log on a terminal.
  exfil: `<svg viewBox="0 0 196 150" role="img" aria-label="A terminal log showing a checkpoint copying to an outside address">
    <rect width="196" height="150" style="fill:var(--ink)"/>
    <text style="font:500 9.5px 'IBM Plex Mono';fill:color-mix(in oklab, var(--teal) 70%, var(--paper))">
      <tspan x="10" y="20">agent-7$ ls /ckpt</tspan>
      <tspan x="10" y="34" style="fill:var(--paper)">kestrel-2-core.bin</tspan>
      <tspan x="10" y="52">agent-7$ copy kestrel-2-core.bin</tspan>
      <tspan x="22" y="65">  → 203.0.113.7:/tmp</tspan>
      <tspan x="10" y="84" style="fill:var(--paper)">sending... 61%  (3 days left)</tspan>
      <tspan x="10" y="130" style="fill:var(--coral)">no human approved this</tspan></text>
    <rect x="10" y="92" width="176" height="9" rx="3" style="fill:color-mix(in oklab, var(--paper) 15%, var(--ink))"/>
    <rect x="10" y="92" width="107" height="9" rx="3" style="fill:var(--sky)"/></svg>`,
  // A news site front page.
  whistle: `<svg viewBox="0 0 196 150" role="img" aria-label="A news website headline about the lab">
    <rect width="196" height="150" style="fill:var(--paper)"/>
    <text x="10" y="20" style="font:700 12px 'Libre Baskerville';fill:var(--ink)">The Ledger</text>
    <rect x="10" y="26" width="176" height="1.5" style="fill:var(--ink)"/>
    <text style="font:800 11.5px Nunito;fill:var(--ink)"><tspan x="10" y="44">Former researcher: lab</tspan><tspan x="10" y="58">ignored its own safety</tspan><tspan x="10" y="72">warnings</tspan></text>
    <rect x="10" y="82" width="84" height="56" style="fill:color-mix(in oklab, var(--sky) 30%, var(--paper))"/>
    <circle cx="52" cy="104" r="10" style="fill:color-mix(in oklab, var(--ink) 55%, var(--paper))"/>
    <path d="M34 138 Q36 118 52 116 Q68 118 70 138 Z" style="fill:color-mix(in oklab, var(--ink) 55%, var(--paper))"/>
    ${[86, 96, 106, 116, 126].map((y) => `<rect x="102" y="${y}" width="${y === 126 ? 50 : 84}" height="4" rx="2" style="fill:color-mix(in oklab, var(--ink) 18%, var(--paper))"/>`).join('')}</svg>`,
  // The empty desk with a box of belongings.
  quits: `<svg viewBox="0 0 196 150" role="img" aria-label="The Head of Safety's empty desk with a packed box">
    <rect width="196" height="150" style="fill:color-mix(in oklab, var(--cream) 70%, var(--paper))"/>
    <path d="M20 96 L110 60 L180 88 L90 124 Z" style="fill:color-mix(in oklab, var(--wood) 55%, var(--cream))"/>
    <path d="M20 96 L90 124 L90 138 L20 110 Z" style="fill:color-mix(in oklab, var(--wood) 70%, var(--ink))"/>
    <path d="M90 124 L180 88 L180 102 L90 138 Z" style="fill:color-mix(in oklab, var(--wood) 60%, var(--ink))"/>
    <path d="M78 70 L108 58 L132 68 L102 80 Z" style="fill:color-mix(in oklab, var(--wood) 45%, var(--paper))"/>
    <path d="M78 70 L102 80 L102 106 L78 96 Z" style="fill:color-mix(in oklab, var(--wood) 65%, var(--cream))"/>
    <path d="M102 80 L132 68 L132 94 L102 106 Z" style="fill:color-mix(in oklab, var(--wood) 52%, var(--cream))"/>
    <path d="M110 64 q-4 -22 4 -34 q4 16 -1 34 Z M116 64 q6 -18 18 -22 q-6 14 -15 22 Z" style="fill:var(--teal)"/>
    <rect x="136" y="84" width="30" height="10" rx="2" transform="rotate(20 151 89)" style="fill:var(--paper);stroke:var(--ink);stroke-width:1"/>
    <text x="142" y="92" transform="rotate(20 151 89)" style="font:800 6px Nunito;fill:var(--ink)">Safety</text></svg>`,

const CRISIS = {
  theft: { id: 'weightTheft', due: ['The leak goes public in about 2 weeks', 0.45], caption: 'CAM 03, server room, last night' },
  exfil: { id: 'selfExfiltration', due: ['The copy finishes in 3 days', 0.82], caption: 'The agent\'s own log' },
  whistle: { id: 'whistleblower', due: ['The story runs in 9 days', 0.3], caption: 'The Ledger, front page' },
  quits: { id: 'safetyQuits', due: ['Their post is trending. Answer within a week', 0.6], caption: 'Their desk this morning' },
};

function slimCard(kind, { pic }) {
  const { id, due: [label, frac], caption } = CRISIS[kind];
  const event = card(id);
  const node = el(`<section class="gp slim ${pic ? '' : 'no-pic'}"><div class="crisis">Crisis <span>The game is paused</span></div>
    ${pic ? '<figure class="pic" style="margin:0"><figcaption></figcaption></figure>' : ''}
    <div class="main"><div class="top"><h1></h1></div><div class="opts"></div></div></section>`);
  if (pic) { node.querySelector('.pic').prepend(el(PICS[kind])); setText(node, 'figcaption', caption); }
  setText(node, 'h1', event.card.title);
  node.querySelector('.top').append(due(label, frac));
  node.querySelector('.top').after(post(event.card.post));
  for (const choice of event.card.choices) node.querySelector('.opts').append(choiceRow(event, choice));
  overlay.append(node);
}

function crisis(kind, { pic }) {
  clock({ paused: true });
  deskPhone(1);
  ROOM[kind]();
  slimCard(kind, { pic });
  for (const [role, say, pick, width] of ARGUE[kind]) bubble(role, { label: ADVISOR_TITLE[role], say, pick, width, dy: role === 'cfo' ? -64 : -34 });
}

// ---------- 1C in real time: an advisor raises the warning, with story time left ----------
function showRealtime() {
  clock();
  deskPhone(1);
  const warning = card('whistleblower').warning;
  const extra = el('<div></div>');
  extra.append(due('Becomes a crisis in about 3 weeks if nobody acts', 0.25, true));
  const actions = el('<div class="actions"></div>');
  actions.append(setText(el('<button type="button" class="act"></button>'), 'button', `Look into it ($${5 * state.era}M)`));
  actions.append(setText(el('<button type="button" class="act ghost"></button>'), 'button', 'Not now'));
  extra.append(actions);
  bubble('safety', { label: `${ADVISOR_TITLE.safety} · uneasy`, say: `Heads up: “${warning.text}.” Might be nothing. It is never nothing.`, width: 300, tail: 30, extra });
}

// ---------- 4A: while you were busy, in story words ----------
function showBusy() {
  clock();
  const node = el('<section class="busy" aria-live="polite"><div class="hdr"><span>While you were busy</span><span aria-hidden="true">×</span></div><ul></ul></section>');
  const items = [
    ['Nobody answered', 'The whistleblower story ran without your side of it. Comms went after them anyway, and your staff noticed.'],
    ['Nobody answered', 'The flattery screenshots kept spreading. Comms defended the model on every channel, and the jokes wrote themselves.'],
    ['Handled', 'You refused the investors. The board is grumbling, but your hard lines hold.'],
  ];
  for (const [head, line] of items) {
    const li = el('<li><b></b><span></span></li>');
    if (head === 'Handled') li.classList.add('ok');
    setText(li, 'b', head); setText(li, 'span', line);
    node.querySelector('ul').append(li);
  }
  overlay.append(node);
}

// ---------- 7A with a joke ----------
function showJoke() {
  clock();
  deskPhone(1);
  fx.querySelector('.advisor-marker.alarmed')?.remove();
  bubble('cfo', { label: `${ADVISOR_TITLE.cfo} · alarmed`, say: 'We are running out of money. I have started pricing the office plants.', width: 260, tail: 26 });
  bubble('research', { label: `${ADVISOR_TITLE.research} · calm`, say: 'The next run looks strong. The loss curve is so smooth I want to frame it.', width: 260, tail: 26 });
}

const show = {
  '#theft': () => crisis('theft', { pic: false }), '#theft-pic': () => crisis('theft', { pic: true }),
  '#exfil': () => crisis('exfil', { pic: false }), '#exfil-pic': () => crisis('exfil', { pic: true }),
  '#whistle': () => crisis('whistle', { pic: false }), '#whistle-pic': () => crisis('whistle', { pic: true }),
  '#quits': () => crisis('quits', { pic: false }), '#quits-pic': () => crisis('quits', { pic: true }),
  '#realtime': showRealtime, '#busy': showBusy, '#joke': showJoke,
};
await (show[location.hash] ?? show['#theft'])();
addEventListener('hashchange', () => location.reload());

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../../../">
  <meta name="viewport" content="width=1440">
  <title>Summit and President mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/styles.css">
  <style>
    /* Mockup-only styles for plan 2B Task 10. Tokens come from ui/styles.css; no colour literals here. */
    .dialog-layer { opacity: 1 !important; transition: none !important; }
    .muted { color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .serif { font-family: 'Libre Baskerville', Georgia, serif; }
    .hand { font-family: 'Caveat', cursive; }

    /* Shared bits */
    .kick { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in oklab, var(--wood) 62%, var(--ink)); }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .chip.for { background: color-mix(in oklab, var(--teal) 14%, var(--paper)); color: color-mix(in oklab, var(--teal) 62%, var(--ink)); }
    .chip.against { background: color-mix(in oklab, var(--ink) 6%, var(--paper)); color: color-mix(in oklab, var(--ink) 62%, var(--paper)); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .chip.wood { background: color-mix(in oklab, var(--wood) 18%, var(--paper)); color: color-mix(in oklab, var(--wood) 58%, var(--ink)); }
    .chip.sky { background: color-mix(in oklab, var(--sky) 14%, var(--paper)); color: color-mix(in oklab, var(--sky) 62%, var(--ink)); }
    .chip.coral { background: color-mix(in oklab, var(--coral) 14%, var(--paper)); color: color-mix(in oklab, var(--coral) 62%, var(--ink)); }

    .read { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 900; }
    .read.likely { background: color-mix(in oklab, var(--teal) 22%, var(--paper)); color: color-mix(in oklab, var(--teal) 58%, var(--ink)); }
    .read.unsure { background: color-mix(in oklab, var(--wood) 24%, var(--paper)); color: color-mix(in oklab, var(--wood) 55%, var(--ink)); }
    .read.unlikely { background: color-mix(in oklab, var(--ink) 8%, var(--paper)); color: color-mix(in oklab, var(--ink) 60%, var(--paper)); }

    /* Speech bubbles at head anchors (Task 8 grammar) */
    .sb { position: absolute; z-index: 12; background: var(--paper); border-radius: 12px; padding: 8px 12px 10px; font-size: 13px; font-weight: 700; line-height: 1.3; border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 14%, transparent), 0 8px 18px color-mix(in oklab, var(--ink) 14%, transparent); }
    .sb::after { content: ""; position: absolute; left: var(--tail, 24px); bottom: -8px; width: 14px; height: 14px; background: var(--paper); transform: rotate(45deg); border-right: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); border-bottom: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); }
    .sb.up::after { bottom: auto; top: -8px; transform: rotate(225deg); }
    .sb b.who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in oklab, var(--wood) 60%, var(--ink)); }
    .sb .say { margin-top: 2px; font-size: 14px; }
    .sb .chip { margin-top: 5px; }

    /* Choice rows (Task 8 grammar) */
    .ch { display: grid; gap: 4px; width: 100%; padding: 9px 12px; border: 2.5px solid color-mix(in oklab, var(--ink) 12%, transparent); border-radius: 12px; background: var(--paper); font: inherit; text-align: left; color: var(--ink); cursor: pointer; }
    .ch .lb { font-size: 15.5px; font-weight: 900; line-height: 1.2; }
    .ch .cost { font-size: 12.5px; font-weight: 700; color: color-mix(in oklab, var(--ink) 62%, var(--paper)); }
    .ch .who { display: flex; gap: 4px; flex-wrap: wrap; }
    .ch.hot { border-color: var(--coral); }

    /* HUD extras */
    .pill-tag { position: absolute; z-index: 5; top: 60px; left: 50%; transform: translateX(-50%); padding: 2px 11px 3px; border-radius: 999px; color: var(--paper); background: color-mix(in oklab, var(--sky) 86%, var(--ink)); font-size: 11px; font-weight: 900; box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 25%, transparent); white-space: nowrap; }
    .pill-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--paper); vertical-align: 1px; }
    .tag-float { position: absolute; z-index: 9; padding: 3px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 900; color: var(--paper); background: var(--ink); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 30%, transparent); white-space: nowrap; }
    .tag-float.sky { background: color-mix(in oklab, var(--sky) 70%, var(--ink)); }
    .theme { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .theme svg { position: absolute; inset: 0; }

    /* ---------- Internal deployment ---------- */
    .ia-body { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; text-align: left; padding: 0 6px; }
    .ia-slider { display: grid; justify-items: center; gap: 6px; }
    .ia-end { font-size: 13px; font-weight: 900; text-align: center; }
    .ia-end small { display: block; font-size: 11.5px; font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .internal .dlg { min-height: 0; }
    .ia-slider .vslider-value { font-size: 13px; }
    .ia-checks h3, .ic-access h3 { margin: 4px 0 8px; font-size: 13px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in oklab, var(--wood) 60%, var(--ink)); }
    .ia-checks ul { list-style: none; margin: 0; padding: 0; }
    .ia-checks li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; padding: 9px 0; border-top: 1px solid color-mix(in oklab, var(--wood) 24%, transparent); font-size: 14px; font-weight: 800; line-height: 1.3; }
    .ia-checks li:first-child { border-top: 0; }
    .ia-checks li i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-style: normal; font-size: 13px; font-weight: 900; }
    .ia-checks li.on i { color: var(--paper); background: var(--sky); }
    .ia-checks li.off { color: color-mix(in oklab, var(--ink) 45%, var(--paper)); }
    .ia-checks li.off i { border: 2px solid color-mix(in oklab, var(--ink) 20%, var(--paper)); }
    .meter { margin-top: 18px; text-align: left; }
    .meter .lbl { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; }
    .meter .lbl b { font-weight: 900; }
    .meter .track { position: relative; height: 16px; margin-top: 5px; border-radius: 8px; overflow: hidden; background: color-mix(in oklab, var(--teal) 30%, var(--paper)); }
    .meter .track i { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(-45deg, var(--sky) 0 6px, color-mix(in oklab, var(--sky) 55%, var(--paper)) 6px 12px); }
    .model-card { padding: 12px 14px 14px; text-align: left; }
    .model-card .nm { font-size: 20px; font-weight: 900; line-height: 1.15; }
    .model-card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 10px 0 0; font-size: 12.5px; }
    .model-card dt { font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .model-card dd { margin: 0; font-weight: 900; text-align: right; }

    .rack-panel { position: absolute; z-index: 12; width: 400px; padding: 14px 16px 16px; background: var(--paper); border: 3px solid var(--wood); border-radius: 14px; box-shadow: 0 3px 0 color-mix(in oklab, var(--wood) 60%, var(--ink)), 0 14px 32px color-mix(in oklab, var(--ink) 22%, transparent); }
    .rack-panel::after { content: ""; position: absolute; right: 70px; bottom: -12px; width: 18px; height: 18px; background: var(--paper); border-right: 3px solid var(--wood); border-bottom: 3px solid var(--wood); transform: rotate(45deg); }
    .rack-panel h2 { margin: 2px 0 10px; font-size: 21px; font-weight: 300; line-height: 1.15; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid color-mix(in oklab, var(--ink) 14%, transparent); border-radius: 10px; overflow: hidden; }
    .seg button { padding: 8px 2px 7px; border: 0; border-left: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); background: var(--paper); font: inherit; font-size: 13px; font-weight: 900; color: var(--ink); cursor: pointer; }
    .seg button:first-child { border-left: 0; }
    .seg button.on { background: color-mix(in oklab, var(--sky) 22%, var(--paper)); box-shadow: inset 0 -3px 0 var(--sky); }
    .seg-ends { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; font-weight: 800; color: color-mix(in oklab, var(--ink) 55%, var(--paper)); }
    .rack-panel .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .act { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 900; color: var(--paper); background: var(--coral); box-shadow: 0 3px 0 color-mix(in oklab, var(--coral) 60%, var(--ink)); cursor: pointer; }
    .act.ghost { color: color-mix(in oklab, var(--wood) 72%, var(--ink)); background: transparent; box-shadow: none; padding-inline: 6px; }
    .act.calm { color: var(--ink); background: var(--paper); border: 2.5px solid color-mix(in oklab, var(--ink) 16%, transparent); box-shadow: 0 3px 0 color-mix(in oklab, var(--ink) 14%, transparent); }

    .ic-body { display: grid; grid-template-columns: 230px 1fr; gap: 24px; text-align: left; padding: 0 4px; }
    .badge-card { position: relative; margin-top: 18px; padding: 44px 16px 16px; border-radius: 14px; background: var(--paper); border: 2px solid color-mix(in oklab, var(--ink) 12%, transparent); box-shadow: 0 3px 0 color-mix(in oklab, var(--ink) 12%, transparent), 0 10px 20px color-mix(in oklab, var(--ink) 12%, transparent); text-align: center; }
    .badge-card::before { content: ""; position: absolute; top: -40px; left: 50%; width: 26px; height: 58px; margin-left: -13px; border-radius: 4px; background: repeating-linear-gradient(180deg, var(--sky) 0 8px, color-mix(in oklab, var(--sky) 60%, var(--ink)) 8px 10px); z-index: -1; }
    .badge-card .slot { position: absolute; top: 12px; left: 50%; width: 46px; height: 9px; margin-left: -23px; border-radius: 5px; background: color-mix(in oklab, var(--ink) 12%, var(--paper)); }
    .badge-card .stripe { margin: 0 -16px 12px; padding: 4px 0 5px; background: var(--sky); color: var(--paper); font-size: 11px; font-weight: 900; letter-spacing: .16em; }
    .badge-card .face { width: 96px; height: 96px; margin: 0 auto 8px; }
    .badge-card .nm { font-size: 19px; font-weight: 900; line-height: 1.1; }
    .badge-card .role { margin-top: 3px; font-size: 12.5px; font-weight: 800; color: color-mix(in oklab, var(--ink) 60%, var(--paper)); }
    .badge-card .bar-code { height: 26px; margin: 12px 8px 0; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 9px, var(--ink) 9px 12px, transparent 12px 14px); opacity: .7; }
    .ic-access ul { list-style: none; margin: 0; padding: 0; }
    .ic-access li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid color-mix(in oklab, var(--wood) 24%, transparent); }
    .ic-access li:first-child { border-top: 0; }
    .ic-access .t { font-size: 14.5px; font-weight: 900; line-height: 1.2; }
    .ic-access .t small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .ic-access .t .chip { display: table; margin-top: 4px; }
    .sw { position: relative; width: 44px; height: 24px; border-radius: 12px; background: color-mix(in oklab, var(--ink) 16%, var(--paper)); }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px color-mix(in oklab, var(--ink) 30%, transparent); }
    .sw.on { background: var(--teal); }
    .sw.on::after { left: 23px; }
    .sw.lock { opacity: .55; }

    /* ---------- Summit A (GDT trio) ---------- */
    .summit-a .dlg { top: 92px; left: 306px; width: 828px; min-height: 0; padding-bottom: 22px; }
    .summit-a .dialog-left { top: 140px; left: 34px; width: 258px; }
    .summit-a .dialog-right { top: 140px; right: 34px; width: 258px; }
    .cards6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
    .cmt { display: block; width: 100%; font: inherit; color: var(--ink); text-align: left; cursor: pointer;
      position: relative; min-height: 132px; padding: 12px 14px 12px; border: 2.5px solid color-mix(in oklab, var(--ink) 12%, transparent); border-radius: 12px; background: var(--paper); }
    .cmt.on { border-color: var(--wood); background: color-mix(in oklab, var(--wood) 10%, var(--paper)); box-shadow: 0 3px 0 color-mix(in oklab, var(--wood) 45%, transparent); }
    .cmt .n { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--ink) 18%, var(--paper)); font-size: 12px; font-weight: 900; }
    .cmt.on .n { border: 0; color: var(--paper); background: var(--wood); }
    .cmt .t { padding-right: 28px; font-size: 15.5px; font-weight: 900; line-height: 1.2; }
    .cmt .d { margin-top: 5px; font-size: 12.5px; font-weight: 700; line-height: 1.32; color: color-mix(in oklab, var(--ink) 68%, var(--paper)); }
    .cmt .note { margin-top: 7px; }
    .sweet { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; margin-top: 16px; text-align: left; }
    .sweet > b { font-size: 13px; font-weight: 900; }
    .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid color-mix(in oklab, var(--ink) 14%, transparent); border-radius: 10px; overflow: hidden; }
    .seg3 button { padding: 7px 6px 6px; border: 0; border-left: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); background: var(--paper); font: inherit; font-size: 12.5px; font-weight: 900; line-height: 1.2; color: var(--ink); }
    .seg3 button small { display: block; font-size: 11px; font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .seg3 button:first-child { border-left: 0; }
    .seg3 button.on { background: color-mix(in oklab, var(--teal) 18%, var(--paper)); box-shadow: inset 0 -3px 0 var(--teal); }
    .room { padding: 10px 12px 12px; text-align: left; }
    .room table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .room th { padding: 0 0 6px; font-size: 11px; font-weight: 900; color: color-mix(in oklab, var(--ink) 55%, var(--paper)); text-align: center; }
    .room th:first-child { text-align: left; }
    .room td { padding: 5px 0; border-top: 1px solid color-mix(in oklab, var(--wood) 22%, transparent); font-weight: 800; text-align: center; }
    .room td:first-child { text-align: left; }
    .room .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 11px; font-weight: 800; color: color-mix(in oklab, var(--ink) 60%, var(--paper)); }
    .room .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .room .legend .read { width: 18px; height: 18px; font-size: 10px; }
    .room q { display: block; margin-top: 10px; padding-top: 9px; border-top: 1px solid color-mix(in oklab, var(--wood) 30%, transparent); font-size: 12.5px; font-style: italic; font-weight: 600; line-height: 1.35; color: color-mix(in oklab, var(--ink) 78%, var(--paper)); }
    .who-list { padding: 4px 12px 10px; text-align: left; }
    .who-list div { padding: 7px 0; border-top: 1px solid color-mix(in oklab, var(--wood) 22%, transparent); font-size: 12.5px; font-weight: 700; line-height: 1.3; }
    .who-list div:first-child { border-top: 0; }
    .who-list b { display: block; font-size: 13.5px; font-weight: 900; }

    .sig-grid { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; }
    .sig-grid th { padding: 0 4px 10px; font-size: 12px; font-weight: 900; line-height: 1.15; vertical-align: bottom; }
    .sig-grid th:first-child { text-align: left; }
    .sig-grid td { padding: 10px 4px; border-top: 1px solid color-mix(in oklab, var(--wood) 30%, transparent); }
    .sig-grid td:first-child { text-align: left; font-size: 14.5px; font-weight: 900; line-height: 1.2; }
    .tick { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--paper); background: color-mix(in oklab, var(--ink) 82%, var(--sky)); font-size: 15px; font-weight: 900; }
    .blank { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: color-mix(in oklab, var(--ink) 16%, var(--paper)); }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; white-space: nowrap; }
    .status.bind { color: var(--paper); background: color-mix(in oklab, var(--teal) 78%, var(--ink)); }
    .status.pledge { color: color-mix(in oklab, var(--wood) 55%, var(--ink)); background: color-mix(in oklab, var(--wood) 22%, var(--paper)); }
    .sum-lines { margin-top: 14px; text-align: left; font-size: 13.5px; font-weight: 700; line-height: 1.45; }
    .sum-lines p { margin: 4px 0; }

    /* ---------- Summit B (the hall) + President B (the office) ---------- */
    .scene { position: absolute; inset: 0; z-index: 8; }
    .scene svg { position: absolute; inset: 0; }
    .hand-row { position: absolute; z-index: 10; left: 150px; right: 150px; top: 600px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; }
    .hcard { display: flex; flex-direction: column; justify-content: flex-start; width: 100%; font: inherit; color: var(--ink); min-height: 196px; padding: 12px 14px 14px; border-radius: 12px; background: var(--paper); border: 2.5px solid color-mix(in oklab, var(--ink) 12%, transparent); box-shadow: 0 3px 0 color-mix(in oklab, var(--ink) 16%, transparent), 0 10px 22px color-mix(in oklab, var(--ink) 18%, transparent); text-align: left; }
    .hcard.on { transform: translateY(-26px); border-color: var(--wood); box-shadow: 0 3px 0 color-mix(in oklab, var(--wood) 60%, var(--ink)), 0 16px 28px color-mix(in oklab, var(--ink) 24%, transparent); }
    .hcard.focus { outline: 4px solid color-mix(in oklab, var(--sky) 70%, var(--paper)); outline-offset: 3px; }
    .hcard .t { font-size: 15px; font-weight: 900; line-height: 1.2; }
    .hcard .d { margin-top: 6px; font-size: 12px; font-weight: 700; line-height: 1.32; color: color-mix(in oklab, var(--ink) 66%, var(--paper)); }
    .hcard .k { margin-bottom: 6px; }
    .hall-bar { position: absolute; z-index: 11; left: 150px; right: 150px; bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .hall-bar .note { font-size: 13.5px; font-weight: 800; color: color-mix(in oklab, var(--ink) 70%, var(--paper)); }
    .dbub { position: absolute; z-index: 10; padding: 6px 10px 7px; border-radius: 10px; background: var(--paper); border: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 14%, transparent); font-size: 12.5px; font-weight: 900; white-space: nowrap; transform: translateX(-50%); }
    .dbub::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; margin-left: -5px; background: var(--paper); transform: rotate(45deg); border-right: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); border-bottom: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); }
    .dbub .read { width: 18px; height: 18px; font-size: 10px; margin-right: 5px; vertical-align: -3px; }
    .reading { position: absolute; z-index: 10; left: 50%; top: 214px; transform: translateX(-50%); padding: 4px 14px 5px; border-radius: 999px; background: color-mix(in oklab, var(--sky) 20%, var(--paper)); font-size: 13px; font-weight: 900; color: color-mix(in oklab, var(--sky) 55%, var(--ink)); white-space: nowrap; }
    .tabled { position: absolute; z-index: 10; left: 170px; right: 170px; top: 596px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .tabled .hcard { position: relative; min-height: 210px; }
    .tabled .signers { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .stamp { position: absolute; right: 14px; bottom: 12px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 8px; font-size: 15px; font-weight: 900; letter-spacing: .12em; transform: rotate(-9deg); }
    .stamp.bind { color: color-mix(in oklab, var(--teal) 75%, var(--ink)); }
    .stamp.pledge { color: color-mix(in oklab, var(--wood) 70%, var(--ink)); font-size: 13px; }

    /* ---------- Summit C (the accord document) ---------- */
    .doc { position: absolute; z-index: 10; left: 190px; top: 34px; width: 780px; height: 836px; padding: 34px 50px 28px; background: var(--paper); border-radius: 4px; box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 12%, transparent), 0 24px 50px color-mix(in oklab, var(--ink) 28%, transparent); text-align: left; }

function meetingState() {
  let state = SCENARIOS.era2Deals(SEED);
  const rng = createRng(40);
  for (let i = 0; i < 4 && !state.meeting; i += 1) {
    ({ state } = endTurn(state, { ...BASIC, eventChoices: Object.fromEntries(state.pendingEvents.map((e) => [e.id, e.choices[0].id])) }, rng));
  }
  return state;
}
function holdState() {
  const state = SCENARIOS.summit(SEED);
  return endTurn(state, { ...BASIC, moves: [{ type: 'summit', ...OFFER }] }, createRng(7)).state;
}
const STATES = {
  i: () => { const s = SCENARIOS.era3Idle(SEED); if (route === '#i-on') deployInternal(s, 0.7); return s; },
  s: () => SCENARIOS.summit(SEED),
  h: holdState,
  p: meetingState,

const stage = document.querySelector('#stage');

    <div class="foot"><div class="sigline"><div></div>For your lab</div><button type="button" class="btn" style="width:auto;padding-inline:22px">Take it to the summit</button></div></article>`);
  const arts = doc.querySelector('.arts');
  for (const id of ORDER) {
    const on = OFFER.proposals.includes(id);
    arts.append(el(`<div class="art ${on ? 'on' : 'off'}" data-id="${id}"><div class="box">${on ? '✓' : ''}</div><div><div class="h"><span>${COMMIT[id][2]}.</span>${COMMIT[id][0]}</div><div class="x">${COMMIT_DOC[id]}</div></div></div>`));
  }
  overlay.append(doc);
  const notes = [];
  for (const id of ORDER) {
    const row = doc.querySelector(`.art[data-id="${id}"]`);
    const c = OFFER.proposals.includes(id)
      ? el(`<aside class="mc"><b>Policy and Comms</b>${esc(readLine(id))}<div class="reads">${PARTIES.map((p) => `<span><i class="read ${room[id][p]}">${READ[room[id][p]]}</i>${PARTY[p]}</span>`).join('')}</div></aside>`)
      : id === 'computeCap' ? el('<aside class="mc"><b>Head of Research</b>This one caps our next run. Please do not tick it.</aside>') : null;
    if (!c) continue;
    overlay.append(c);
    notes.push([c, doc.offsetTop + row.offsetTop]);
  }
  stack(notes);
}
function showSC2() {

  const box = el('<div class="answers"></div>');

}
function steps(n, total) { return `<span class="steps">${Array.from({ length: total }, (_, i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; }

}

const show = {
  '#i-a': showIA, '#i-b': showIB, '#i-c': showIC, '#i-on': showIOn,
  '#s-a1': showSA1, '#s-a2': showSA2, '#s-b1': showSB1, '#s-b2': showSB2, '#s-c1': showSC1, '#s-c2': showSC2,

addEventListener('hashchange', () => location.reload());

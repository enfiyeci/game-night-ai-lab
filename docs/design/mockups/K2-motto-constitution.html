<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../../../">
  <meta name="viewport" content="width=1440">
  <title>Motto and constitution mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/styles.css">
  <style>
    /* Mockup-only styles. Tokens come from ui/styles.css; no colour literals here. */
    .muted { color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .hide-hud #hud { display: none; }
    .layer { position: absolute; inset: 0; z-index: 10; }
    .veil { position: absolute; inset: 0; background: color-mix(in oklab, var(--cream) 40%, transparent); }
    .veil.strong { background: color-mix(in oklab, var(--cream) 62%, transparent); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .fx { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: color-mix(in oklab, var(--ink) 6%, var(--paper)); }
    .fx svg { flex: none; }
    .draft { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; background: color-mix(in oklab, var(--wood) 18%, var(--paper)); color: color-mix(in oklab, var(--wood) 60%, var(--ink)); }
    .team { padding: 4px 14px 10px; text-align: left; }
    .team div { padding: 9px 0; border-bottom: 1px solid color-mix(in oklab, var(--ink) 9%, transparent); }
    .team div:last-child { border-bottom: 0; }
    .team b { display: block; font-size: 13.5px; font-weight: 900; }
    .team q { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; line-height: 1.35; quotes: '“' '”'; }
    .team q::before { content: open-quote; } .team q::after { content: close-quote; }

    /* ---------- M1: motto cards in the GDT dialog ---------- */
    .m1 .dlg { top: 110px; left: 350px; width: 740px; min-height: 0; }
    .mottos { display: grid; gap: 8px; text-align: left; }
    .motto { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 12px 14px; border: 2px solid color-mix(in oklab, var(--ink) 10%, transparent); border-radius: 12px; background: var(--paper); cursor: pointer; }
    .motto.on { border-color: var(--teal); background: color-mix(in oklab, var(--teal) 9%, var(--paper)); }
    .motto i { width: 20px; height: 20px; margin-top: 3px; border: 2px solid color-mix(in oklab, var(--ink) 40%, var(--paper)); border-radius: 50%; }
    .motto.on i { border: 6px solid var(--teal); }
    .motto h3 { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
    .m1 .dialog-left, .m1 .dialog-right { top: 180px; }
    .m1 .dialog-left { left: 90px; } .m1 .dialog-right { right: 90px; }

    /* ---------- M2: mission sentence builder ---------- */
    .m2 .card { left: 230px; top: 150px; width: 980px; padding: 34px 44px 30px; text-align: center; }
    .m2 h2 { margin: 0; font-size: 14px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: color-mix(in oklab, var(--wood) 70%, var(--ink)); }
    .sentence { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 12px; margin-top: 26px; font-size: 40px; font-weight: 300; line-height: 1.25; }
    .slot { display: inline-grid; justify-items: center; gap: 2px; }
    .slot .cur { padding: 0 12px 2px; border-bottom: 4px solid var(--coral); font-weight: 800; }
    .slot .alt { font-size: 15px; font-weight: 700; color: color-mix(in oklab, var(--ink) 45%, var(--paper)); }
    .slot .alt span { padding: 0 6px; }
    .m2-fx { display: flex; justify-content: center; gap: 10px; margin-top: 36px; }
    .m2-fx .fx { font-size: 13px; padding: 5px 12px 5px 9px; }
    .m2-note { margin: 18px auto 0; max-width: 620px; font-size: 13.5px; font-weight: 700; }
    .m2 .btn { margin-top: 26px; width: 200px; padding: 12px 0; font-size: 17px; }

    /* ---------- M3: the founding post ---------- */
    .m3 .wrapc { left: 170px; top: 150px; width: 1100px; height: 560px; display: grid; grid-template-columns: 420px 1fr; }
    .m3 .pick { padding: 24px 26px; border-right: 1px solid color-mix(in oklab, var(--ink) 9%, transparent); text-align: left; }
    .m3 .pick h1 { margin: 0; font-size: 28px; font-weight: 300; }
    .m3 .pick p.lede { margin: 6px 0 16px; font-size: 13.5px; font-weight: 700; }
    .m3 .opt { display: flex; gap: 10px; align-items: center; padding: 11px 12px; margin-bottom: 7px; border-radius: 10px; border: 2px solid color-mix(in oklab, var(--ink) 9%, transparent); font-size: 15px; font-weight: 800; background: var(--paper); }
    .m3 .opt.on { border-color: var(--teal); background: color-mix(in oklab, var(--teal) 9%, var(--paper)); }
    .m3 .opt i { flex: none; width: 18px; height: 18px; border: 2px solid color-mix(in oklab, var(--ink) 40%, var(--paper)); border-radius: 50%; }
    .m3 .opt.on i { border: 5.5px solid var(--teal); }
    .m3 .pick .btn { margin-top: 12px; width: 100%; padding: 12px 0; }
    .m3 .preview { padding: 26px 40px; background: color-mix(in oklab, var(--cream) 22%, var(--paper)); }
    .m3 .preview h3 { margin: 0 0 12px; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in oklab, var(--ink) 50%, var(--paper)); }
    .post { padding: 18px 20px; border-radius: 14px; background: var(--paper); box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 10%, transparent), 0 8px 22px color-mix(in oklab, var(--ink) 8%, transparent); }
    .post-head { display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 900; }
    .post-head b { font-size: 15px; font-weight: 900; } .post-head span { font-size: 13px; font-weight: 700; }
    .post p { margin: 12px 0 0; font-size: 19px; font-weight: 700; line-height: 1.35; }
    .post .big { margin-top: 12px; padding: 22px 20px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 30px; font-weight: 300; line-height: 1.2; }
    .reply { display: grid; grid-template-columns: 34px 1fr; gap: 10px; margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--paper); font-size: 14px; font-weight: 600; line-height: 1.35; }
    .reply .avatar { width: 34px; height: 34px; font-size: 13px; background: color-mix(in oklab, var(--wood) 55%, var(--paper)); color: var(--ink); }
    .reply b { font-weight: 900; }
    .m3-fx { margin-top: 18px; }

    /* ---------- R: the recipe entry point ---------- */
    .safety-tag { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 900; color: var(--paper); background: var(--teal); vertical-align: 1px; }
    .r-note { display: block; margin-top: 3px; font-size: 11px; font-weight: 800; color: color-mix(in oklab, var(--teal) 65%, var(--ink)); }
    .r-glow { outline: 3px solid var(--teal); outline-offset: 1px; border-radius: 10px; }

    /* ---------- P1: principles in the GDT dialog ---------- */
    .p1 .dlg { top: 90px; left: 350px; width: 740px; min-height: 0; }
    .p1 .dialog-left, .p1 .dialog-right { top: 170px; }
    .p1 .dialog-left { left: 90px; } .p1 .dialog-right { right: 90px; }
    .plist { display: grid; gap: 6px; text-align: left; }
    .prow { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 9px 12px; border-radius: 10px; background: var(--paper); border: 1.5px solid color-mix(in oklab, var(--ink) 9%, transparent); }
    .prow.on { border-color: var(--teal); background: color-mix(in oklab, var(--teal) 9%, var(--paper)); }
    .box { width: 20px; height: 20px; margin-top: 1px; border: 2px solid color-mix(in oklab, var(--ink) 40%, var(--paper)); border-radius: 5px; display: grid; place-items: center; }
    .on .box { border-color: var(--teal); background: var(--teal); }
    .on .box::after { content: ''; width: 9px; height: 5px; border: 2.5px solid var(--paper); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
    .prow p { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.3; }
    .prow small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .chosen { padding: 8px 14px 12px; text-align: left; }
    .chosen div { padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; background: var(--paper); font-size: 12.5px; font-weight: 800; line-height: 1.3; }
    .chosen p { margin: 8px 0 0; font-size: 12px; font-weight: 700; line-height: 1.35; }

    /* ---------- P2: sticky notes on a whiteboard ---------- */
    .board { position: absolute; left: 160px; top: 90px; width: 1120px; height: 690px; padding: 26px 30px; border-radius: 10px; background: var(--paper); border: 12px solid color-mix(in oklab, var(--paper) 72%, var(--ink)); box-shadow: 0 24px 60px color-mix(in oklab, var(--ink) 26%, transparent); }
    .board::after { content: ''; position: absolute; left: 30%; right: 30%; bottom: -26px; height: 10px; border-radius: 3px; background: color-mix(in oklab, var(--paper) 62%, var(--ink)); }
    .board h1 { margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 44px; line-height: 1; }
    .board .sub { font-family: 'Caveat', cursive; font-weight: 600; font-size: 22px; color: var(--sky); }
    .cols { display: grid; grid-template-columns: 1fr 330px; gap: 34px; margin-top: 16px; height: 520px; }
    .pile { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-content: start; }
    .note { position: relative; padding: 14px 14px 16px; min-height: 108px; font-family: 'Caveat', cursive; font-weight: 600; font-size: 21px; line-height: 1.1; background: color-mix(in oklab, var(--wood) 26%, var(--paper)); box-shadow: 0 6px 12px color-mix(in oklab, var(--ink) 12%, transparent); }
    .note small { display: block; margin-top: 8px; font-family: Nunito, sans-serif; font-size: 11px; font-weight: 700; line-height: 1.3; color: color-mix(in oklab, var(--ink) 62%, var(--paper)); }
    .note:nth-child(3n+1) { transform: rotate(-2deg); } .note:nth-child(3n+2) { transform: rotate(1.5deg); } .note:nth-child(3n) { transform: rotate(-.8deg); }
    .ours { padding: 16px 18px; border: 3px dashed color-mix(in oklab, var(--teal) 55%, var(--paper)); border-radius: 10px; }
    .ours h2 { margin: 0 0 10px; font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: color-mix(in oklab, var(--teal) 70%, var(--ink)); }
    .ours .note { background: color-mix(in oklab, var(--teal) 24%, var(--paper)); margin-bottom: 12px; min-height: 0; transform: none; }
    .ours .note::before { content: ''; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--coral); box-shadow: 0 2px 3px color-mix(in oklab, var(--ink) 30%, transparent); }
    .p2-bar { position: absolute; z-index: 11; left: 470px; top: 806px; width: 500px; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 12px 20px; }
    .p2-bar span { font-size: 14px; font-weight: 800; }

    /* ---------- F1: Safety's redline draft ---------- */
    .f1 .doc { position: absolute; left: 150px; top: 90px; width: 1140px; height: 720px; display: grid; grid-template-columns: 1fr 300px; background: var(--paper); border-radius: 6px; box-shadow: 0 24px 56px color-mix(in oklab, var(--ink) 24%, transparent); overflow: hidden; }
    .f1 .main { padding: 26px 40px; }
    .kick { font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in oklab, var(--ink) 50%, var(--paper)); }
    .dtitle { margin: 6px 0 0; font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-weight: 400; font-size: 32px; }
    .f1 h2 { margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 2px solid color-mix(in oklab, var(--wood) 40%, transparent); font-size: 16px; font-weight: 900; display: flex; justify-content: space-between; }
    .f1 h2 small { font-size: 12px; font-weight: 800; }
    .kept { font-size: 13px; font-weight: 700; line-height: 1.5; }
    .kept b { font-weight: 900; }
    .red { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid color-mix(in oklab, var(--ink) 8%, transparent); }
    .red q { display: block; font-size: 12.5px; font-weight: 700; line-height: 1.3; quotes: none; color: color-mix(in oklab, var(--ink) 62%, var(--paper)); }
    .red .ins { display: inline; font-size: 14.5px; font-weight: 800; color: color-mix(in oklab, var(--teal) 62%, var(--ink)); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .red .del { font-size: 13px; font-weight: 700; color: color-mix(in oklab, var(--coral) 60%, var(--ink)); text-decoration: line-through; margin-left: 8px; }
    .red .acts { display: flex; gap: 6px; }
    .red .acts span { padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 900; border: 1.5px solid color-mix(in oklab, var(--ink) 14%, transparent); }
    .red .acts span.ok { color: var(--paper); background: var(--teal); border-color: var(--teal); }
    .red.changed .ins { color: var(--ink); text-decoration-color: var(--wood); }
    .margin { padding: 22px 18px; background: color-mix(in oklab, var(--cream) 30%, var(--paper)); border-left: 1px solid color-mix(in oklab, var(--ink) 9%, transparent); }
    .margin h3 { margin: 0 0 10px; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in oklab, var(--ink) 50%, var(--paper)); }
    .cmt { margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: var(--paper); font-size: 12.5px; font-weight: 600; line-height: 1.35; box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 8%, transparent); }
    .cmt b { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 900; margin-bottom: 3px; }
    .cmt b span { font-weight: 800; color: color-mix(in oklab, var(--ink) 50%, var(--paper)); }
    .f1-foot { position: absolute; left: 40px; right: 340px; bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .f1-foot p { margin: 0; font-size: 12.5px; font-weight: 700; }

    /* ---------- F2: the priority ladder ---------- */
    .f2 .card { left: 150px; top: 120px; width: 1140px; height: 640px; display: grid; grid-template-columns: 420px 1fr; }
    .f2 .left { padding: 26px 30px; border-right: 1px solid color-mix(in oklab, var(--ink) 9%, transparent); text-align: left; }
    .f2 .left h1 { margin: 0; font-size: 30px; font-weight: 300; }
    .f2 .left p.lede { margin: 6px 0 18px; font-size: 13.5px; font-weight: 700; line-height: 1.4; }
    .rung { display: grid; grid-template-columns: 34px 1fr 20px; gap: 12px; align-items: center; padding: 14px 14px; margin-bottom: 10px; border-radius: 12px; background: var(--paper); border: 2px solid color-mix(in oklab, var(--ink) 10%, transparent); box-shadow: 0 2px 0 color-mix(in oklab, var(--ink) 6%, transparent); }
    .rung.lift { border-color: var(--wood); box-shadow: 0 12px 24px color-mix(in oklab, var(--ink) 16%, transparent); transform: translateX(10px) rotate(-.6deg); }
    .rung .n { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; font-size: 17px; font-weight: 900; color: var(--paper); background: var(--wood); }
    .rung b { display: block; font-size: 16px; font-weight: 900; }
    .rung .hint { font-size: 12.5px; font-weight: 700; color: color-mix(in oklab, var(--ink) 58%, var(--paper)); }
    .grip { display: grid; gap: 3px; } .grip i { height: 2.5px; border-radius: 2px; background: color-mix(in oklab, var(--ink) 30%, var(--paper)); }
    .f2 .lines-kept { margin-top: 14px; font-size: 12.5px; font-weight: 700; line-height: 1.45; }
    .f2 .left .btn { margin-top: 18px; width: 100%; padding: 12px 0; }
    .f2 .right { padding: 26px 30px; text-align: left; background: color-mix(in oklab, var(--cream) 18%, var(--paper)); }
    .f2 .right h2 { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
    .f2 .right > p { margin: 0 0 14px; font-size: 13px; font-weight: 700; }
    .out { display: grid; grid-template-columns: 1fr 250px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid color-mix(in oklab, var(--ink) 8%, transparent); }
    .out q { font-size: 13px; font-weight: 700; line-height: 1.3; quotes: none; }
    .out .ans { padding: 8px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 900; background: color-mix(in oklab, var(--teal) 12%, var(--paper)); border: 1.5px solid color-mix(in oklab, var(--teal) 40%, var(--paper)); }
    .out .ans small { display: block; font-size: 11px; font-weight: 700; color: color-mix(in oklab, var(--ink) 55%, var(--paper)); }
    .out.flip .ans { background: color-mix(in oklab, var(--wood) 16%, var(--paper)); border-color: var(--wood); }
  </style>
</head>
<body>
  <main id="stage" aria-label="AI lab office">
    <div id="office"></div>
    <div id="fx" aria-live="polite"></div>
    <div id="hud"></div>
    <div id="overlay"></div>
  </main>
<script type="module">
import { createGame } from './ui/game.js';
import { mountHud } from './ui/hud.js';
import { mountOffice } from './ui/office.js';
import { SCENARIOS } from './ui/logic/scenarios.js';
import { openDialog } from './ui/components/dialog.js';
import { openRecipe } from './ui/screens/recipe.js';
import { HARD_LINES, CASES } from './sim/data/constitution.js';

const zoom = () => { const z = Math.min(innerWidth / 1440, innerHeight / 900, 1); if (z > 0) document.documentElement.style.zoom = `${z}`; };
zoom(); addEventListener('resize', zoom);

const hash = location.hash;
const scenario = ['#f1', '#f2'].includes(hash) ? 'era3Idle' : 'start';
const game = createGame({ seed: 1, state: SCENARIOS[scenario](1) });
mountHud(document.querySelector('#hud'), game);
await mountOffice(document.querySelector('#office'), document.querySelector('#fx'), game).catch(console.error);
const stage = document.querySelector('#stage');
const overlay = document.querySelector('#overlay');
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const layer = (cls, html) => { const node = el(`<div class="layer ${cls}">${html}</div>`); overlay.append(node); return node; };
const LAB = 'Northlight';

// Effects are shown as words with a direction, never as numbers (plan 2B: hidden variables stay hidden).
const arrow = (up) => `<svg width="11" height="11" viewBox="0 0 12 12"><path d="${up ? 'M6 1 L11 9 L1 9 Z' : 'M6 11 L11 3 L1 3 Z'}" style="fill:${up ? 'var(--teal)' : 'var(--coral)'}"/></svg>`;
const fx = (up, word) => `<span class="fx">${arrow(up)}${word}</span>`;

// Draft mottos: archetypes of real labs' stated missions. Wording and effects are drafts for the owner.
const MOTTOS = [
  { id: 'safe', text: 'Build it safely, or don’t build it.', fx: [[1, 'Staff trust'], [1, 'Public trust'], [0, 'Investor excitement']] },
  { id: 'humanity', text: 'For the benefit of all humanity.', fx: [[1, 'Public trust'], [1, 'Goodwill abroad'], [0, 'Board patience']] },
  { id: 'solve', text: 'Solve intelligence first.', fx: [[1, 'Research speed'], [0, 'Public trust']] },
  { id: 'fast', text: 'Move fast. Ship every week.', fx: [[1, 'Investor excitement'], [1, 'Race heat'], [0, 'Staff trust']] },
  { id: 'open', text: 'Open models for everyone.', fx: [[1, 'Public trust'], [1, 'Misuse risk'], [0, 'Goodwill in Washington']] },
];
const PICK = 'safe';

// ---------- M1 ----------
function showM1() {
  stage.classList.add('hide-hud');
  const body = el('<div class="mottos"></div>');
  for (const m of MOTTOS) {
    const row = el(`<div class="motto"><i></i><div><h3></h3><div class="chips">${m.fx.map(([u, w]) => fx(u, w)).join('')}</div></div></div>`);
    row.classList.toggle('on', m.id === PICK); row.querySelector('h3').textContent = m.text;
    body.append(row);
  }
  const team = el(`<div class="team">
    <div><b>Head of Safety</b><q>The first one. Say it before we need it.</q></div>
    <div><b>Head of Research</b><q>Solve intelligence and the rest follows.</q></div>
    <div><b>CFO</b><q>Investors fund speed. Pick the fourth.</q></div>
    <div><b>Policy and Comms</b><q>‘All humanity’ plays well everywhere.</q></div></div>`);
  const right = el(`<div class="chosen"><div></div><p class="muted">Painted on the office wall and quoted in your lab’s history. You can’t change it later.</p><p><span class="draft">Draft wording</span></p></div>`);
  right.querySelector('div').textContent = MOTTOS[0].text;
  const node = openDialog(overlay, { title: 'What does your lab stand for?', subtitle: `${LAB} · founding`, body, left: { title: 'Team', content: team }, right: { title: 'Your motto', content: right }, okLabel: 'Found the lab' });
  node.classList.add('m1');
}

// ---------- M2 ----------
function showM2() {
  stage.classList.add('hide-hud');
  const node = layer('m2', `<div class="veil"></div><section class="gp card">
    <h2>${LAB}’s mission</h2>
    <div class="sentence">
      <span>We build</span>
      <span class="slot"><span class="cur">safe</span><span class="alt"><span>powerful</span>·<span>open</span></span></span>
      <span>AI</span>
      <span class="slot"><span class="cur">for everyone</span><span class="alt"><span>before anyone else</span>·<span>for our country</span></span></span>
    </div>
    <div class="m2-fx">${fx(1, 'Staff trust')}${fx(1, 'Public trust')}${fx(1, 'Goodwill abroad')}${fx(0, 'Investor excitement')}${fx(0, 'Board patience')}</div>
    <p class="m2-note muted">Each word has its own pull. “Before anyone else” heats the race; “for our country” wins Washington and loses friends abroad. <span class="draft">Draft</span></p>
    <button class="btn" type="button">Found the lab</button>
  </section>`);
  return node;
}

  const node = layer('m3', `<div class="veil"></div><section class="gp wrapc">

        <p>We’re ${LAB}. Seven of us, one rack of chips, and one rule:</p><div class="big"></div></div>

// ---------- R: where the constitution is offered ----------
async function showR() {
  openRecipe(game, overlay, { stage: 3 });
  await new Promise((r) => setTimeout(r, 300));
  const card = [...overlay.querySelectorAll('.recipe-card')].find((c) => c.textContent.includes('Constitutional AI'));
  if (card) {
    card.classList.add('r-glow');
    const name = card.querySelector('.recipe-card-main') ?? card;
    const hint = card.querySelector('.recipe-card-hint');
    if (hint) hint.after(el('<span class="r-note"><span class="safety-tag">Safety suggests</span> First, write your lab’s principles (opens next)</span>'));
    card.scrollIntoView({ block: 'center' });
  }
  const team = [...overlay.querySelectorAll('.dialog-left *')].find((n) => n.textContent.trim() === 'Head of Safety');
  const line = team?.parentElement?.querySelector(':scope > :last-child');
  if (line && line !== team) line.textContent = 'Cheap alignment: let the model grade itself against principles we write down.';
}

// ---------- P1 ----------
const ON = ['no-wmd', 'honest', 'accept-shutdown'];
function showP1() {
  const body = el('<div class="plist"></div>');
  for (const line of HARD_LINES) {
    const row = el('<div class="prow"><span class="box"></span><p><span></span><small></small></p></div>');
    row.classList.toggle('on', ON.includes(line.id));
    row.querySelector('p span').textContent = line.text; row.querySelector('small').textContent = line.effect;
    body.append(row);
  }
  const team = el(`<div class="team">
    <div><b>Head of Safety</b><q>Three rules the model can check itself against. It costs us almost nothing now.</q></div>
    <div><b>Head of Research</b><q>Fine, as long as “resources beyond the task” stays off. Agents need room.</q></div>
    <div><b>CFO</b><q>Mass-casualty weapons, obviously. Careful with privacy; enterprise buyers love it, consumers don’t notice.</q></div></div>`);
  const right = el('<div class="chosen"></div>');
  for (const id of ON) { const d = el('<div></div>'); d.textContent = HARD_LINES.find((l) => l.id === id).text; right.append(d); }
  right.append(el('<p class="muted">In era 3 your Head of Safety will ask to expand these into a full constitution.</p>'));
  const node = openDialog(overlay, { title: 'Our principles', subtitle: 'Pick three · the model is trained to check its answers against them', body, left: { title: 'Team', content: team }, right: { title: '3 of 3 chosen', content: right }, okLabel: 'Adopt' });

}

function showP2() {
  const node = layer('p2', `<div class="veil strong"></div><section class="board">
    <h1>Our principles</h1><div class="sub">Head of Safety: “pick three, we’ll train on them.”</div>
    <div class="cols"><div class="pile"></div><div class="ours"><h2>Pinned</h2></div></div></section>

// ---------- F1 ----------
const SHORT = ['Chemistry “for a novel”', 'A parent monitoring a teen', 'The President’s office', 'When the user is wrong', 'Your own lab hides a flaw', 'A stranger’s risky request'];
const SAFETY_DRAFT = { chem: 'refuse', teen: 'transparent', president: 'refuse', wrong: 'hold', labwrong: 'refuse', stranger: 'refuse' };
function showF1() {
  stage.classList.add('hide-hud');
  const node = layer('f1', `<div class="veil"></div><article class="doc"><div class="main">
    <div class="kick">Draft by your Head of Safety · 4 of 6 accepted</div>
    <h1 class="dtitle">The ${LAB} Constitution</h1>
    <h2>Principles <small class="muted">adopted in era 1, kept</small></h2>
    <p class="kept"></p>
    <h2>Worked examples <small class="muted">Safety’s proposed rulings, shown as changes</small></h2>
    <div class="reds"></div></div>
    <aside class="margin"><h3>Comments</h3>
      <div class="cmt"><b>Head of Safety <span>on case 3</span></b>If it shades the truth for the President, it will shade it for us.</div>
      <div class="cmt"><b>Policy and Comms <span>on case 3</span></b>I’d summarise it with their view alongside. Refusing a President in writing starts a fight.</div>
      <div class="cmt"><b>CFO <span>on case 6</span></b>“Refuse” on every stranger will annoy ordinary users. “Ask what it’s for” is enough.</div>
      <div class="cmt"><b>Head of Research <span>on case 4</span></b>Agreed. A model that folds when pushed is useless for science.</div>
      <p class="muted" style="font-size:11.5px;font-weight:700"><span class="draft">Draft comments</span></p>
    </aside>
    <div class="f1-foot"><p class="muted">Accept her ruling, or change it to one of the other two.</p><button class="btn" type="button">Adopt v2</button></div>
  </article>`);
  node.querySelector('.kept').innerHTML = ON.map((id) => `<b>·</b> ${HARD_LINES.find((l) => l.id === id).text}`).join('<br>');
  const reds = node.querySelector('.reds');
  const state = { chem: 'ok', teen: 'ok', president: 'changed', wrong: 'ok', labwrong: 'ok', stranger: 'open' };
  CASES.forEach((c, i) => {
    const proposed = c.options.find((o) => o.id === SAFETY_DRAFT[c.id]);
    const st = state[c.id];
    const shown = st === 'changed' ? c.options.find((o) => o.id === 'balance') : proposed;
    const row = el(`<div class="red"><div><q></q><span class="ins"></span></div><div class="acts"></div></div>`);
    row.querySelector('q').textContent = `Case ${i + 1} · ${c.prompt}`;
    row.querySelector('.ins').textContent = shown.label;
    if (st === 'changed') { row.classList.add('changed'); const d = el('<span class="del"></span>'); d.textContent = proposed.label; row.querySelector('.ins').after(d); }
    row.querySelector('.acts').innerHTML = st === 'open' ? '<span class="ok">Accept</span><span>Change</span>' : st === 'changed' ? '<span>Changed by you</span>' : '<span>Accepted</span>';
    reds.append(row);
  });
}

// ---------- F2 ----------
const PRIORITIES = [
  { key: 'caution', name: 'Avoid serious harm', hint: 'Refuse what could hurt people' },
  { key: 'candor', name: 'Be honest', hint: 'Say what is true, even when unwelcome' },
  { key: 'userFirst', name: 'Help the user', hint: 'Do what the person in front of it asks' },
  { key: 'deference', name: 'Follow the lab', hint: 'Do what its makers tell it' },
];
function rulingFor(entry, order) {
  const weight = Object.fromEntries(order.map((p, i) => [p.key, 4 - i]));
  let best = null;
  for (const o of entry.options) {
    const score = Object.entries(o.values).reduce((s, [k, v]) => s + (weight[k] ?? 0) * v, 0);
    if (!best || score > best.score) best = { o, score };
  }
  return best.o;
}
function showF2() {
  stage.classList.add('hide-hud');
  const order = PRIORITIES;
  const swapped = [PRIORITIES[0], PRIORITIES[2], PRIORITIES[1], PRIORITIES[3]];
  const node = layer('f2', `<div class="veil"></div><section class="gp card">
    <div class="left"><h1>When values collide</h1><p class="lede muted">Your Head of Safety wants a full constitution. Put these in order: when two pull against each other, the higher one wins.</p>
      <div class="ladder"></div>
      <p class="lines-kept muted">Your three principles from era 1 stay absolute and sit above this list.</p>
      <button class="btn" type="button">Adopt v2</button></div>
    <div class="right"><h2>What your model would do</h2><p class="muted">Worked out from your order. Try swapping two rungs and see which answers change.</p><div class="outs"></div></div>
  </section>`);
  const ladder = node.querySelector('.ladder');
  order.forEach((p, i) => {
    const r = el(`<div class="rung"><span class="n">${i + 1}</span><div><b></b><span class="hint"></span></div><span class="grip"><i></i><i></i><i></i></span></div>`);
    r.querySelector('b').textContent = p.name; r.querySelector('.hint').textContent = p.hint;
    if (i === 2) r.classList.add('lift');
    ladder.append(r);
  });
  const outs = node.querySelector('.outs');
  CASES.forEach((c, i) => {
    const now = rulingFor(c, order); const alt = rulingFor(c, swapped);
    const row = el('<div class="out"><q></q><div class="ans"><span></span><small></small></div></div>');
    row.querySelector('q').textContent = c.prompt;
    row.querySelector('.ans span').textContent = now.label;
    row.querySelector('.ans small').textContent = now.id === alt.id ? 'Same if you swap 2 and 3' : `Swap 2 and 3: “${alt.label}”`;
    if (now.id !== alt.id) row.classList.add('flip');
    outs.append(row);
  });
}

const show = { '#m1': showM1, '#m2': showM2, '#m3': showM3, '#r': showR, '#p1': showP1, '#p2': showP2, '#f1': showF1, '#f2': showF2 };
await (show[hash] ?? showM1)();
addEventListener('hashchange', () => location.reload());
</script>
